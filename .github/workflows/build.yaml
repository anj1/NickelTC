name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "gcc10-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GCC10_IMAGE: ghcr.io/${{ github.repository_owner }}/nickeltc-gcc10
  LOCAL_GCC10_IMAGE: nickeltc-gcc10-validation

jobs:
  gcc10:
    name: GCC 10 container and coroutine validation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and validation binaries
        run: IMAGE="$LOCAL_GCC10_IMAGE" ./build-coroutine-validation.sh

      - name: Install QEMU user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user

      - name: Run coroutine validation under QEMU
        run: qemu-arm out/coroutine-validation-static

      - name: Package coroutine validation
        run: ./package-coroutine-validation.sh

      - name: Upload coroutine validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: coroutine-validation
          path: dist-coroutine-validation/

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GCC 10 image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tags=()
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
            tags+=("$GCC10_IMAGE:sha-$GITHUB_SHA")
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=("$GCC10_IMAGE:$GITHUB_REF_NAME")
          fi
          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo "No immutable tags selected for $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 0
          fi

          : > /tmp/nickeltc-push.log
          for tag in "${tags[@]}"; do
            docker tag "$LOCAL_GCC10_IMAGE" "$tag"
            docker push "$tag" | tee -a /tmp/nickeltc-push.log
          done

          {
            echo "### Published GCC 10 image"
            echo
            echo '```'
            cat /tmp/nickeltc-push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
